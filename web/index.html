<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F5F5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="description" content="TaskPPS - 流水线任务编排与执行控制台" />
    <title>TaskPPS</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <!--
      THESIS: 暖橙工作台（Warm Orange Workbench）。把任务编排控制台从「冷色工程蓝图」
        黑白极简主题：中性灰打底，黑色 #1F1F1F 作为主色（v4 黑白化：原为暖橙 #FF6D5A）
        链接/激活态/运行中状态，日志与 REPL 保留 One-KVM 深色终端签名。拒绝同一尺寸的
        「图标+标题+文案」卡片堆砌与冷 slate 蓝灰的工程图纸腔。
      OWN-WORLD: 中性灰 #F5F5F5 底 + 白卡片柔和阴影 + 黑色单强调色；Inter + JetBrains Mono；
        大圆角(12-16) + 发丝暖灰边框仅用于表格/输入框；DAG 画布暖白点阵；深色终端日志面板。
      STORY: 开发者打开即认识——像 n8n 一样的自托管编排工作台，状态用色块一眼可扫，
        运行日志在深色终端里滚动。用户信任、快速、专业。
      FIRST VIEWPORT: 登录页 = 暖白底 + 左上角极淡暖橙光晕 + 居中白卡（暖橙 CTA）。
        主布局 = 白侧栏（橙激活态）+ 白顶栏 + 暖灰内容区；仪表盘 2×2 统计卡 + 走势图 + 最近运行表。
      FORM: 用户指定的 n8n 浅色风格方向（浅色重新设计 + 暖橙强调色，已确认）；无概念抽签。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
        review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
